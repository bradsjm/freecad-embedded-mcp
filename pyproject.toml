[project]
name = "freecad-mcp-addon"
version = "2.0.0"
description = "FreeCAD add-on embedding a loopback Model Context Protocol server"
readme = "README.md"
authors = [
    { name = "neka-nat", email = "nekanat.stock@gmail.com" },
    { name = "Jonathan", email = "jb@nrgup.net" },
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["addon/FreeCADMCP"]

[tool.hatch.build.targets.sdist]
only-include = ["addon", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
